{% extends "base.html" %}

{% block title %}Add Scholarship{% endblock %}

{% block content %}

<section class="container">

    <h1>Add New Scholarship</h1>

    <form method="POST">

        <label>🎓 Scholarship Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter scholarship name"
            required>

        <label>🌍 Country</label>
        <input
            type="text"
            name="country"
            placeholder="e.g. Canada"
            required>

        <label>🏫 University</label>
        <input
            type="text"
            name="university"
            placeholder="e.g. University of Toronto">

        <label>💻 Field of Study</label>
        <input
            type="text"
            name="field"
            placeholder="e.g. Computer Science"
            required>

        <label>🎓 Degree Level</label>
        <select name="degree" required>

            <option value="">Select Degree</option>
            <option>Bachelor</option>
            <option>Master</option>
            <option>PhD</option>

        </select>

        <label>💰 Funding</label>
        <select name="funding">

            <option>Fully Funded</option>
            <option>Partially Funded</option>
            <option>Tuition Only</option>

        </select>

        <label>📅 Application Deadline</label>
        <input
            type="date"
            name="deadline"
            required>

        <label>📄 Description</label>
        <textarea
            name="description"
            rows="5"
            placeholder="Brief scholarship description"></textarea>

        <label>🔗 Official Application Link</label>
        <input
            type="url"
            name="link"
            placeholder="https://example.com">

        <label>📌 Status</label>

        <select name="status" required>

            <option value="Open">🟢 Open</option>
            <option value="Closed">🔴 Closed</option>

        </select>

        <br>

        <button type="submit" class="btn">

            ➕ Add Scholarship

        </button>

        <a href="{{ url_for('admin') }}" class="btn">

            ← Back to Dashboard

        </a>

    </form>

</section>

{% endblock %}
